# Hot-reload override for host development.
# Usage: docker compose -f docker-compose.yml -f compose.dev.yml up --build
#
# Prefer host-local `npm run dev` + backend uvicorn for day-to-day UI work;
# this file keeps a containerized reload path when needed.
#
# Arrangement catalog override (optional):
# 1) Uncomment the bind below so the JSON is visible inside the backend container.
# 2) Set ARRANGEMENT_INSTRUMENT_CATALOG_PATH=/data/arrangement_instruments.v1.json
#    in `.env` (container path — not the host path). See docs/composition-arrangement.md.

services:
  backend:
    volumes:
      - ./backend:/app
      - mukit_project_data:/data
      # Optional read-only catalog override (pair with ARRANGEMENT_INSTRUMENT_CATALOG_PATH):
      # - ./path/to/arrangement_instruments.v1.json:/data/arrangement_instruments.v1.json:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload
    # Dev image still uses the production Dockerfile CMD override above.
    # ARRANGEMENT_INSTRUMENT_CATALOG_PATH is inherited from docker-compose.yml.

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  frontend_node_modules:
