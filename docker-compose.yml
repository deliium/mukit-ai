version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models
      - ./backend/training_data:/app/training_data
    environment:
      - PYTHONPATH=/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8888
    depends_on:
      - backend
