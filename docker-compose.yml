version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8888:8888"
    volumes:
      - ./backend:/app
      - ./backend/models:/app/models
      - ./backend/training_data:/app/training_data
      - mukit_project_data:/data
    environment:
      - PYTHONPATH=/app
      - PROJECT_DB_PATH=/data/projects.db
      # Default FluidR3_GM path from Debian package fluid-soundfont-gm
      - COMPOSITION_WAV_SOUNDFONT=/usr/share/sounds/sf2/FluidR3_GM.sf2
    command: uvicorn app.main:app --host 0.0.0.0 --port 8888 --reload

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=http://localhost:8888
    depends_on:
      - backend

volumes:
  mukit_project_data: