version: '3.8'

# Production-local stack. Copy `.env.example` → `.env`, set at least one LLM API key,
# then: docker compose up --build
# See README for first-run walkthrough (Task 11 docs).

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8888:8888"
    volumes:
      - mukit_project_data:/data
    environment:
      PYTHONPATH: /app
      PROJECT_DB_PATH: ${PROJECT_DB_PATH:-/data/projects.db}
      COMPOSITION_WAV_SOUNDFONT: ${COMPOSITION_WAV_SOUNDFONT:-/usr/share/sounds/sf2/FluidR3_GM.sf2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-60}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mukit_project_data:
