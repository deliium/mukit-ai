version: '3.8'

# Production-local stack. Copy `.env.example` → `.env`, set at least one LLM API key,
# then: docker compose up --build
# See README for first-run walkthrough (Task 11 docs).
#
# Optional local AI (llama.cpp / vLLM / training stub) — never required for default up:
#   docker compose -f docker-compose.yml -f compose.local-ai.yml --profile local-ai up --build
# See docs/local-ai.md.

services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    ports:
      - "8888:8888"
    volumes:
      - mukit_project_data:/data
    environment:
      PYTHONPATH: /app
      PROJECT_DB_PATH: ${PROJECT_DB_PATH:-/data/projects.db}
      COMPOSITION_WAV_SOUNDFONT: ${COMPOSITION_WAV_SOUNDFONT:-/usr/share/sounds/sf2/FluidR3_GM.sf2}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEFAULT_LLM_PROVIDER: ${DEFAULT_LLM_PROVIDER:-openai}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-180}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.7}
      LLM_FAKE_MODE: ${LLM_FAKE_MODE:-0}
      LLM_FAKE_MODEL: ${LLM_FAKE_MODEL:-fake-deterministic}
      AI_OP_GENERATE: ${AI_OP_GENERATE:-}
      AI_OP_GENERATE_PLANNER: ${AI_OP_GENERATE_PLANNER:-}
      AI_OP_GENERATE_COMPOSER: ${AI_OP_GENERATE_COMPOSER:-}
      AI_OP_REGION_EDIT: ${AI_OP_REGION_EDIT:-}
      AI_OP_ARRANGE_PREVIEW: ${AI_OP_ARRANGE_PREVIEW:-}
      AI_OP_DEVELOPMENT_PREVIEW: ${AI_OP_DEVELOPMENT_PREVIEW:-}
      AI_OP_REHARMONIZE_AI: ${AI_OP_REHARMONIZE_AI:-}
      AI_OP_CREATIVE_MOTIF: ${AI_OP_CREATIVE_MOTIF:-}
      AI_OP_TRANSCRIBE: ${AI_OP_TRANSCRIBE:-}
      AI_OP_EMBED: ${AI_OP_EMBED:-}
      AI_OP_AUDIO_RENDER: ${AI_OP_AUDIO_RENDER:-}
      AI_FALLBACK_GENERATE: ${AI_FALLBACK_GENERATE:-}
      AI_FALLBACK_REGION_EDIT: ${AI_FALLBACK_REGION_EDIT:-}
      AI_FALLBACK_ARRANGE_PREVIEW: ${AI_FALLBACK_ARRANGE_PREVIEW:-}
      AI_FALLBACK_DEVELOPMENT_PREVIEW: ${AI_FALLBACK_DEVELOPMENT_PREVIEW:-}
      AI_FALLBACK_REHARMONIZE_AI: ${AI_FALLBACK_REHARMONIZE_AI:-}
      AI_FALLBACK_CREATIVE_MOTIF: ${AI_FALLBACK_CREATIVE_MOTIF:-}
      AI_MODEL_REGISTRY_PATH: ${AI_MODEL_REGISTRY_PATH:-}
      # Optional local OpenAI-compatible sidecar (ignored when LOCAL_LLM_ENABLED=0).
      # Sidecar images/devices live only under compose.local-ai.yml profiles.
      LOCAL_LLM_ENABLED: ${LOCAL_LLM_ENABLED:-0}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://local-llm:8080/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      LOCAL_LLM_CONTEXT_SIZE: ${LOCAL_LLM_CONTEXT_SIZE:-4096}
      LOCAL_LLM_QUANTIZATION: ${LOCAL_LLM_QUANTIZATION:-Q4_K_M}
      LOCAL_LLM_DEVICE: ${LOCAL_LLM_DEVICE:-rocm}
      LOCAL_LLM_MEMORY_LIMIT_MB: ${LOCAL_LLM_MEMORY_LIMIT_MB:-12288}
      LOCAL_LLM_MAX_CONCURRENCY: ${LOCAL_LLM_MAX_CONCURRENCY:-1}
      LOCAL_LLM_TIMEOUT_SECONDS: ${LOCAL_LLM_TIMEOUT_SECONDS:-180}
      LOCAL_LLM_API_KEY: ${LOCAL_LLM_API_KEY:-local}
      IMPORT_MAX_UPLOAD_BYTES: ${IMPORT_MAX_UPLOAD_BYTES:-5242880}
      IMPORT_MAX_EXPANDED_BYTES: ${IMPORT_MAX_EXPANDED_BYTES:-26214400}
      IMPORT_MAX_COMPRESSION_RATIO: ${IMPORT_MAX_COMPRESSION_RATIO:-50}
      IMPORT_MAX_ARCHIVE_ENTRIES: ${IMPORT_MAX_ARCHIVE_ENTRIES:-64}
      IMPORT_MAX_TRACKS: ${IMPORT_MAX_TRACKS:-64}
      IMPORT_MAX_NOTES: ${IMPORT_MAX_NOTES:-100000}
      IMPORT_MAX_BARS: ${IMPORT_MAX_BARS:-512}
      IMPORT_MAX_PPQ: ${IMPORT_MAX_PPQ:-1920}
      IMPORT_MAX_METADATA_CHANGES: ${IMPORT_MAX_METADATA_CHANGES:-512}
      IMPORT_MAX_ACTIVE_NOTES: ${IMPORT_MAX_ACTIVE_NOTES:-512}
      IMPORT_DEFAULT_TARGET_PPQ: ${IMPORT_DEFAULT_TARGET_PPQ:-480}
      # Optional: absolute path *inside this container* to arrangement.instruments.v1 JSON.
      # Bind-mount the file first (see compose.dev.yml). Empty = packaged fixture.
      ARRANGEMENT_INSTRUMENT_CATALOG_PATH: ${ARRANGEMENT_INSTRUMENT_CATALOG_PATH:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  mukit_project_data:
