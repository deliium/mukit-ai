# Alembic configuration for Mukit AI project SQLite schema.
# CLI (from backend/): PROJECT_DB_PATH=/path/to/projects.db alembic upgrade head
# App startup runs the same upgrade via app.db.connection.initialize_database().

[alembic]
script_location = %(here)s/app/db/alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os

# Overridden at runtime from PROJECT_DB_PATH (or default backend/data/projects.db).
sqlalchemy.url = sqlite:///./data/projects.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
